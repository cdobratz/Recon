name: Deploy site

# Deploys the static site only. It does not build or publish the CLI,
# and it does not start the local MCP server.
# A successful deploy attaches tracelamp.dev and writes DNS in the
# existing Cloudflare zone. Run it only after CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set. Do not also connect Workers Builds.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    name: workers static assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the static site
        run: python3 site/check.py

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

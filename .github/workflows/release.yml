name: Release

# Builds native binaries for each target, then publishes one GitHub Release.
# Does not publish to crates.io. Push a tag vX.Y.Z that matches Cargo.toml.
# This workflow does not run on pull requests.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python scripts/package_release.py \
            --target "${{ matrix.target }}" \
            --version "$tag" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: github release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh release create shells out to git. The artifact download alone is not a repository.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "TraceLamp $version" \
            --notes "Binaries for TraceLamp ${version}. Each archive contains the tracelamp and recon commands, LICENSE, NOTICE, and README.md. recon is the compatibility command. SHA256SUMS lists the archive hashes. This release does not publish a crate."

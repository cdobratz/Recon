[scan]
extensions = []
ignore_patterns = [
    "node_modules/**",
    ".git/**",
    "target/**",
    "__pycache__/**",
    ".venv/**",
    "vendor/**",
    "dist/**",
    "build/**",
    ".go/**",
]
max_file_size = 1048576
categories = ["api_endpoints", "functions", "db_connections", "agents", "mcp", "secrets"]

[llm]
provider = "ollama"
max_tokens = 4096
temperature = 0.3
max_cost_usd = 0.25
max_findings = 40
max_snippet_chars = 240

[mcp]
servers = []
serve_transport = "stdio"
serve_port = 3000
# scan_root is required before `tracelamp mcp serve` will read a path.
# Set it to an absolute directory, or set TRACELAMP_SCAN_ROOT.

[skills]
directory = "skills"

[report]
default_format = "terminal"
min_severity = "info"
